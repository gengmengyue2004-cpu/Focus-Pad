<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f4ee" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Focus Pad · 夜间预览</title>
  
  
  <link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="../night.css?v=history-contrast-205" /><link rel="stylesheet" href="../companion.css"/><link rel="stylesheet" href="../compact-editor.css"/><link rel="stylesheet" href="../desktop.css"/><link rel="stylesheet" href="../widget-panels.css?v=editor-full-20261021"/></head>
<body data-theme="night"><header class="preview-header"><a href="#" class="brand">Focus Pad <span>v2 / 夜间预览</span></a><div class="theme-picker" aria-label="预览主题"><button data-theme-choice="day">日间</button><button data-theme-choice="night" class="selected">夜间</button><button data-theme-choice="auto">跟随时间</button><button data-open-custom type="button" aria-pressed="false">自定义</button></div></header><aside class="preview-caption"><h1>让专注，慢慢入夜。</h1><p>熟悉的节奏，多了一点月光。</p></aside>
  <main class="desktop">
    <section class="widget" id="widget" aria-label="FocusPad 悬浮专注组件" data-state="idle" data-expanded="false" data-view="focus" data-focus-mode="task">
      <a class="moon-entry" href="../companion.html" target="_blank" rel="noopener" title="月亮陪伴与个性化" aria-label="打开月亮陪伴网页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 15A8 8 0 0 1 9 5a8 8 0 1 0 10 10Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></a><div class="widget__handle" id="dragHandle" aria-hidden="true"></div>

      <button class="widget__pin" id="modeIndicator" type="button" aria-label="当前为任务专注模式，点击切换自由专注"><span></span></button>

      <header class="widget__header">
        <div class="widget__meta">
          <div class="widget__label">FOCUS</div>
          <div class="widget__time" id="timeLabel" role="button" tabindex="0" aria-label="展开专注组件">30:00</div>
        </div>
        <div class="widget__view-switch" role="tablist" aria-label="切换视图">
          <button class="view-switch__button is-active" id="focusViewButton" type="button" role="tab" aria-selected="true">FOCUS</button>
          <button class="view-switch__button" id="tasksViewButton" type="button" role="tab" aria-selected="false">TASKS</button>
        </div>
        <button class="widget__toggle" id="expandButton" type="button" aria-expanded="false" aria-label="展开组件"><span></span></button>
      </header>

      <button class="focus-mode-button" id="focusModeButton" type="button">任务 / 自由专注</button>
      <section class="view view--focus" id="focusView" aria-label="专注视图">
        <button class="current-task" id="currentTaskButton" type="button" aria-label="查看当前任务">
          <span class="current-task__eyebrow">NOW</span>
          <span class="current-task__name" id="currentTaskName">完成课程作业</span>
          <span class="current-task__time" id="currentTaskTime">Focus 00:00</span>
        </button>
        <button class="curveButton" id="curveButton" type="button" aria-label="注意力曲线与时长">
          <svg class="curve" viewBox="0 0 240 150" role="img" aria-hidden="true">
            <defs><filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5" result="blur" /><feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.96 0 1 0 0 0.58 0 0 1 0 0.24 0 0 0 0.24 0" /></filter></defs>
            <path id="trackPath" class="curve__track" d="M 24 104 A 100 100 0 0 1 216 104" />
            <path id="fillPath" class="curve__fill" d="M 24 104 A 100 100 0 0 1 216 104" />
            <circle id="currentPoint" class="curve__point" cx="24" cy="104" r="8" />
            <path class="curve__pulse" d="M 24 104 A 100 100 0 0 1 216 104" filter="url(#softGlow)" />
          </svg>
        </button>
        <section class="widget__body" aria-label="专注控制">
          <div class="widget__status" id="statusLabel">准备好了</div>
          <div class="controls">
            <div class="duration" id="durationRow" aria-label="选择专注时长">
              <button class="duration__chip" type="button" data-minutes="15">15</button><button class="duration__chip" type="button" data-minutes="20">20</button><button class="duration__chip" type="button" data-minutes="25">25</button><button class="duration__chip is-active" type="button" data-minutes="30">30</button><button class="duration__chip" type="button" data-minutes="45">45</button><button class="duration__chip duration__custom" id="customDurationButton" type="button" aria-label="自定义专注时长">＋</button><label class="duration__input-wrap" id="customDurationPanel" hidden><input id="customDurationInput" type="number" min="1" max="240" inputmode="numeric" placeholder="分钟" aria-label="自定义分钟数"><button id="customDurationConfirm" type="button">确定</button></label>
            </div>
            <div class="actions">
              <button class="action is-primary" id="startButton" type="button">开始</button><button class="action" id="pauseButton" type="button">暂停</button><button class="action" id="resetButton" type="button">重置</button><button class="action action--complete" id="completeCurrentButton" type="button" aria-label="确认当前任务完成"><span aria-hidden="true">✓</span> 完成</button>
            </div>
          </div>
        </section>
      </section>

      <section class="view view--tasks" id="tasksView" aria-label="任务队列视图" hidden>
        <div class="task-queue__header"><span>TASK QUEUE</span><span id="queueCount">1 / 3</span></div>
        <div class="task-stack" id="taskStack" aria-live="polite"></div>
        <div class="task-queue__empty" id="emptyQueue" hidden><p>写下一件要专注的事</p></div>
        <form class="task-composer" id="taskForm"><input id="taskInput" type="text" maxlength="28" placeholder="添加下一件事" aria-label="添加任务" /><button id="addTaskButton" type="submit" aria-label="添加任务">+</button></form>
        <section class="task-history" id="taskHistory" aria-label="任务历史">
          <button class="task-history__toggle" id="taskHistoryToggle" type="button" aria-haspopup="dialog">
            <span class="task-history__heading"><span aria-hidden="true">✓</span> 任务历史</span>
            <span class="task-history__count" id="taskHistoryCount">已完成 0 个任务</span>
            <span class="task-history__arrow" aria-hidden="true"></span>
          </button>
        </section>
      </section>

      <section class="view widget-editor" id="editorView" aria-label="自定义月亮轨迹" data-compact-editor="true" data-theme="night" hidden>
        <header class="widget-editor__header"><button class="widget-editor__back" id="editorBack" type="button" aria-label="返回专注组件">‹</button><div><strong>自定义轨迹</strong><span>月亮沿着你的节奏前进</span></div></header>
        <section id="your-rhythm" aria-labelledby="rhythm-title">
          <h2 class="sr-label" id="rhythm-title">自定义月亮轨迹</h2>
          <div class="editor-layout"><div><svg class="curve-editor" id="energyEditor" viewBox="0 0 420 250" role="group" aria-label="夜间精力曲线，拖动圆点调整">
            <defs><linearGradient id="curveArea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a995dd" stop-opacity=".18"/><stop offset="1" stop-color="#a995dd" stop-opacity="0"/></linearGradient></defs>
            <path class="editor-grid" d="M32 42H388 M32 105H388 M32 168H388 M32 42V168 M121 42V168 M210 42V168 M299 42V168 M388 42V168"/>
            <path id="editorArea" fill="url(#curveArea)"/><path id="editorPath" class="editor-path"/><g id="energyPoints"></g>
            <text class="editor-label" x="20" y="225">开始</text><text class="editor-label" x="108" y="225">进入状态</text><text class="editor-label" x="199" y="225">中段</text><text class="editor-label" x="288" y="225">收尾</text><text class="editor-label" x="377" y="225">结束</text>
          </svg>
          <div class="curve-presets" aria-label="轨迹预设"><button data-preset="arc" class="active">标准圆弧</button><button data-preset="early">先专注，后放松</button><button data-preset="late">慢慢进入状态</button><button data-preset="steady">平缓的一晚</button></div>
          </div><div><div class="energy-fields" id="energyFields"></div><div class="energy-field glow-control"><label for="glowRange">月光柔和度</label><input id="glowRange" type="range" min="0" max="100" value="70"/><output id="glowValue">70</output></div></div></div>
          <div class="apply-row"><button id="savePersonality">应用</button><button class="secondary" id="restorePersonality">恢复默认</button><span class="save-status" id="saveStatus" role="status" aria-live="polite">已读取你的设置</span></div>
        </section>
      </section>

      <div class="completion-toast" id="completionToast" role="status" aria-live="polite" hidden><span>✓</span><div><strong>Task Completed</strong><small id="completionTime">Focus Time 00:00</small></div></div>
      <div class="history-dialog" id="historyDialog" role="dialog" aria-modal="true" aria-label="任务历史" hidden>
        <button class="history-dialog__backdrop" id="historyDialogBackdrop" type="button" aria-label="关闭任务历史"></button>
        <section class="history-dialog__surface">
          <header class="history-dialog__header"><div><span>✓</span><strong>任务历史</strong><small id="historyDialogCount">已完成 0 个任务</small></div><button class="history-dialog__close" id="historyDialogClose" type="button" aria-label="关闭任务历史">×</button></header>
          <div class="completed-list history-dialog__list" id="completedList" aria-live="polite" tabindex="0"></div>
        </section>
      </div>
      <div class="onboarding" id="onboardingLayer" hidden>
        <div class="onboarding__spotlight" id="onboardingSpotlight" aria-hidden="true"></div>
        <div class="onboarding__card" id="onboardingCard" role="dialog" aria-live="polite" aria-label="FocusPad 使用引导">
          <button class="onboarding__skip" id="onboardingSkip" type="button">跳过</button>
          <div class="onboarding__step" id="onboardingStep">1 / 8</div>
          <strong class="onboarding__title" id="onboardingTitle">注意力曲线</strong>
          <span class="onboarding__copy" id="onboardingCopy">记录专注节奏</span>
          <button class="onboarding__next" id="onboardingNext" type="button">下一步</button>
        </div>
      </div>
    </section>
  </main><footer class="preview-footer"><div class="phase-control"><label for="phaseSelect">月相预览</label><select id="phaseSelect"><option value="today">当天月相</option><option value="0">新月</option><option value="0.12" selected>娥眉月</option><option value="0.25">上弦月</option><option value="0.38">盈凸月</option><option value="0.5">满月</option><option value="0.62">亏凸月</option><option value="0.75">下弦月</option><option value="0.88">残月</option></select><span id="phaseDescription"></span></div><p id="scheduleLabel">21:00 — 06:00 自动入夜 · 点击时间展开完整功能</p></footer>
  
  <script src="../desktop-store.js"></script><script src="../task-queue.js"></script>
  <script src="../task-history.js"></script>
  <script src="../window-size.js"></script>
  <script src="../app.js?v=editor-full-20261021"></script><script src="../companion-core.js?v=wide-arc-2"></script><script src="../night.js?v=theme-entry-1"></script><script src="../companion.js?v=editor-full-20261021"></script><script src="../compact-editor.js?v=editor-full-20261021"></script></body>
</html>

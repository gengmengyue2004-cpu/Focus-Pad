<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Pad · 首次使用引导预览</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#11121e;color:#eeedf7;font:14px 'Segoe UI','Microsoft YaHei',sans-serif}header{padding:24px 32px;display:flex;justify-content:space-between;align-items:center}header span{color:#9699b2;font-size:12px}button{font:inherit;cursor:pointer;border:0}#replay{background:#ffffff12;color:#dfddf3;padding:9px 16px;border-radius:20px}main{position:relative;max-width:850px;margin:12px auto;min-height:660px;width:100%;display:grid;place-items:center}iframe{transform:translateX(-145px);width:350px;height:550px;border:0;background:transparent}#ring{position:absolute;pointer-events:none;border:2px solid #c4b4ff;border-radius:17px;box-shadow:0 0 0 5px #b6a3ff18,0 0 22px #ac97ff30;transition:all .3s}#card{position:absolute;width:268px;padding:22px;border:1px solid #a9a0d24d;border-radius:22px;background:#26283ceF;box-shadow:0 18px 60px #0005;backdrop-filter:blur(15px)}#step{font-size:11px;color:#b9a8f6;letter-spacing:2px}h2{font-size:18px;font-weight:600;margin:12px 0 9px}p{font-size:13px;line-height:1.8;color:#b7b9cd;margin:0 0 20px}.buttons{display:flex;align-items:center;gap:8px}#next{margin-left:auto;border-radius:18px;background:#c7b8fa;color:#252337;padding:9px 17px;font-weight:600}#back,#skip{background:none;color:#aaadc3;font-size:12px;padding:7px 0}#back{margin-right:12px}.note{text-align:center;color:#777d99;font-size:12px;margin:12px 20px 30px}@media(max-width:650px){header{padding:20px}header span{display:none}main{margin:0;min-height:800px;align-items:start;padding-top:5px}#card{width:300px!important;left:calc(50% - 150px)!important;top:450px!important}iframe{height:430px;transform:none}}
#tryAction{display:block;width:100%;margin:0 0 17px;padding:10px 12px;border-radius:12px;background:#c7b8fa18;color:#e2dbff;border:1px solid #c7b8fa55;font-size:12px}#tryAction[hidden]{display:none}#customModal[hidden]{display:none}#customModal{position:fixed;inset:0;z-index:100;background:#090a16cf;display:grid;place-items:center;padding:20px}.custom-shell{position:relative;width:min(336px,100%);border:1px solid #77728f;border-radius:22px;background:#10111d;overflow:hidden}.custom-top{padding:10px 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff15;color:#ddd8f3;font-size:13px}.custom-top button{background:#ffffff12;color:#fff;border-radius:16px;padding:6px 13px}#customFrame{transform:none;width:100%;height:412px;max-height:calc(100dvh - 100px);display:block}#customStatus{font-size:12px;color:#b8bdce;padding:0 20px 12px}#customStatus{display:none}.custom-shell{border:2px solid #62657c;border-radius:25px 21px 26px 22px}.custom-top{font-size:12px;font-weight:750}.custom-top button{font-size:11px;line-height:1.2;padding:5px 9px}#customFrame{background:#1c1e31}</style><header><div>Focus Pad <span>／ 首次使用引导预览</span></div><button id="replay">重新体验</button></header><main id="stage"><iframe id="preview" title="悬浮组件演示" src="guide-demo/app/index.html"></iframe><div id="ring"></div><section id="card" role="dialog" aria-label="首次使用引导"><div id="step"></div><h2 id="title"></h2><p id="copy"></p><button id="tryAction" hidden></button><div class="buttons"><button id="back">上一步</button><button id="skip">暂时跳过</button><button id="next">下一步 →</button></div></section></main><div class="note">使用引导 · 演示操作不影响你的任务和设置</div>
<div id="customModal" hidden role="dialog" aria-modal="true" aria-label="自定义轨迹预览"><div class="custom-shell"><div class="custom-top"><span>自定义轨迹</span><button id="closeCustom">返回 ×</button></div><iframe id="customFrame" title="自定义轨迹界面"></iframe><div id="customStatus">可调整轨迹并点击“应用”，回到引导即可查看；只保存演示设置。</div></div></div><script>
function resetGuideArc(){const w=document.getElementById('preview').contentWindow;const config=w.MoonCompanion.save(w.MoonCompanion.defaults);w.NightPreview.applyPersonality(config);}
function openGuideCustomization(){const modal=document.getElementById('customModal'),editor=document.getElementById('customFrame');modal.hidden=false;if(!editor.getAttribute('src'))editor.src='guide-demo/companion.html?compact=1#your-rhythm';document.getElementById('closeCustom').focus();}document.getElementById('closeCustom').onclick=()=>{document.getElementById('customModal').hidden=true;document.getElementById('tryAction').focus();};document.addEventListener('keydown',event=>{if(event.key==='Escape')document.getElementById('customModal').hidden=true;});
const frame=document.getElementById('preview'),stage=document.getElementById('stage'),ring=document.getElementById('ring'),card=document.getElementById('card');let index=0;const steps=[
['让专注，有一点陪伴','这是一枚可以拖动、置顶的桌面小组件。太阳和月亮会沿着轨迹，陪你走过一段专注。','#widget','focus'],
['从一段专注开始','选择分钟数，点击「开始」。需要歇一歇时再次点击即可暂停，暂停不会计入专注时间。','.actions','focus'],
['你的时长，你来决定','点击「＋」输入分钟数。长按或右键某个时长，出现 × 后再点击删除。','#durationRow','focus'],
['把时间留给具体的事','在 TASKS 中添加任务，点击任务即可切换。每个任务独立累计，完成后可以在历史记录中查看。','#tasksViewButton','tasks'],
['白天与夜晚，轻轻切换','点击右上角圆点切换日夜。默认跟随本机时间，21 点后进入夜间，早晨 6 点恢复日间。','#modeIndicator','focus'],
['点击轨道，打开自定义','试着点击左边的圆弧，打开自定义界面。拖动控制点或选择预设，为自己调整一条更合适的专注轨迹。','#curveButton','focus'],
['给月亮一条自己的轨迹','点击左下角太阳或月亮，打开陪伴页面：了解月相，也可以调整适合自己的专注轨迹。','.moon-entry','focus'],
['放心关掉，下次继续','任务、专注历史和个性化设置会保存在电脑上。正常退出立即保存，运行中也会定期保存。','#widget','focus']];
function show(){const d=frame.contentDocument,w=frame.contentWindow,s=steps[index];w.setExpanded(true);w.setView(s[3]);d.querySelectorAll('[data-guide-interactive]').forEach(el=>el.removeAttribute('data-guide-interactive'));const trial=document.getElementById('tryAction');trial.hidden=!(index===4||index===5);trial.textContent=index===4?'试一试：切换日夜 ☀ / ☾':'试一试：打开自定义 →';trial.onclick=()=>{if(index===4)d.querySelector('#modeIndicator').click();else openGuideCustomization();};if(index===4||index===5)d.querySelector(s[2]).setAttribute('data-guide-interactive','');document.getElementById('step').textContent=String(index+1).padStart(2,'0')+' / '+String(steps.length).padStart(2,'0');document.getElementById('title').textContent=s[0];document.getElementById('copy').textContent=s[1];document.getElementById('back').hidden=index===0;document.getElementById('next').textContent=index===steps.length-1?'开始使用 ✓':'下一步 →';ring.hidden=false;card.hidden=false;requestAnimationFrame(()=>{const r=d.querySelector(s[2]).getBoundingClientRect(),f=frame.getBoundingClientRect(),b=stage.getBoundingClientRect();const x=f.left-b.left+r.left,y=f.top-b.top+r.top;Object.assign(ring.style,{left:x-5+'px',top:y-5+'px',width:r.width+10+'px',height:r.height+10+'px'});card.style.left=Math.min(stage.clientWidth-280,x+r.width+24)+'px';card.style.top=Math.max(10,Math.min(400,y-20))+'px';});}
frame.onload=()=>{const d=frame.contentDocument;const style=d.createElement('style');style.textContent='html,body{background:transparent!important;overflow:hidden!important;min-height:0!important}body::before,body::after,.preview-header,.preview-caption,.preview-footer{display:none!important}.desktop{display:flex!important;align-items:flex-start!important;padding-top:14px;height:auto!important;min-height:0!important;background:none!important}.widget,.widget[data-expanded=true]{zoom:1!important;width:306px!important}.widget__handle{pointer-events:none}body{pointer-events:none}[data-guide-interactive]{pointer-events:auto!important;cursor:pointer!important}';d.head.append(style);frame.contentWindow.persist=()=>{};frame.contentWindow.setSelectedDuration(30);resetGuideArc();show();};document.getElementById('next').onclick=()=>{if(index===steps.length-1){card.hidden=true;ring.hidden=true;window.close();return}index++;show()};document.getElementById('back').onclick=()=>{index--;show()};document.getElementById('skip').onclick=()=>{card.hidden=true;ring.hidden=true;window.close()};document.getElementById('replay').onclick=()=>{document.getElementById('customModal').hidden=true;resetGuideArc();index=0;show()};window.onresize=()=>{if(!card.hidden)show()};
</script></html>
